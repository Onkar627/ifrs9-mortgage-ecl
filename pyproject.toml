[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifrs9-mortgage-ecl"
version = "0.1.0"
description = "IFRS 9-style lifetime expected credit loss engine on Freddie Mac loan-level data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
